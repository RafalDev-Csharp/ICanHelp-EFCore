<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="announcements" href="/announcements">
      <ion-icon aria-hidden="true" name="megaphone-outline"></ion-icon>
      <ion-label>Ogłoszenia</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="add" href="/add">
      <ion-icon aria-hidden="true" name="add-circle-outline"></ion-icon>
      <ion-label>Dodaj</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="conversations" href="/conversations">
      <ion-icon aria-hidden="true" name="chatbubbles-outline"></ion-icon>
      <ion-label>Rozmowy</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="notifications" href="/notifications">
      <ion-icon aria-hidden="true" name="notifications-outline"></ion-icon>
      <ion-label>Powiadomienia</ion-label>
      @if (unreadBadge(); as badge) {
      <ion-badge color="danger" [attr.aria-label]="badge + ' nieprzeczytanych'">{{ badge }}</ion-badge>
      }
    </ion-tab-button>

    <ion-tab-button tab="profile" href="/profile">
      <ion-icon aria-hidden="true" name="person-circle-outline"></ion-icon>
      <ion-label>Profil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
