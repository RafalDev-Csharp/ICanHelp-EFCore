<ion-tabs>
  <ion-tab-bar slot="bottom" (ionTabButtonClick)="openTabRoot($event)">
    <ion-tab-button tab="announcements" href="/announcements">
      <ion-icon aria-hidden="true" name="search-outline"></ion-icon>
      <ion-label>Szukaj</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="liked" href="/liked">
      <ion-icon aria-hidden="true" name="heart-outline"></ion-icon>
      <ion-label>Ulubione</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="add" href="/add">
      <ion-icon aria-hidden="true" name="add-circle-outline"></ion-icon>
      <ion-label>Dodaj</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="conversations" href="/conversations">
      <ion-icon aria-hidden="true" name="briefcase-outline"></ion-icon>
      <ion-label>Zlecenia</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile" href="/profile">
      <ion-icon aria-hidden="true" name="person-circle-outline"></ion-icon>
      <ion-label>Konto</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
