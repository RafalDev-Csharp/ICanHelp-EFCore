<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/profile"></ion-back-button>
      <app-brand></app-brand>
    </ion-buttons>
    <ion-title>Moje ogłoszenia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page-column">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @switch (state()) { @case ('loading') {
  <div class="ion-text-center ion-padding" aria-busy="true">
    <ion-spinner name="crescent"></ion-spinner>
  </div>
  } @case ('failed') {
  <app-empty-state
    icon="cloud-offline-outline"
    heading="Nie udało się wczytać ogłoszeń"
    message="Sprawdź połączenie z internetem i spróbuj ponownie."
  >
    <ion-button (click)="reload()">Spróbuj ponownie</ion-button>
  </app-empty-state>
  } @case ('ready') { @if (items().length === 0) {
  <app-empty-state
    icon="document-text-outline"
    heading="Nie masz jeszcze ogłoszeń"
    message="Opisz, w czym potrzebujesz pomocy – sąsiedzi z okolicy złożą oferty."
  >
    <ion-button routerLink="/add">Dodaj ogłoszenie</ion-button>
  </app-empty-state>
  } @else {
  <ion-list>
    @for (item of items(); track item.id) {
    <app-announcement-card [announcement]="item" [showStatus]="true"></app-announcement-card>
    }
  </ion-list>
  <ion-infinite-scroll [disabled]="complete()" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
  } } }
</ion-content>
