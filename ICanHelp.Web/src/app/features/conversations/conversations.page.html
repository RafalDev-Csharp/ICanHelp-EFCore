<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/conversations"></ion-back-button>
      <app-brand></app-brand>
    </ion-buttons>
    <ion-title>Wszystkie rozmowy</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [value]="role()" (ionChange)="setRole($event.detail.value)" aria-label="Rola w rozmowie">
      <ion-segment-button value="all"><ion-label>Wszystkie</ion-label></ion-segment-button>
      <ion-segment-button value="Client"><ion-label>Zlecam</ion-label></ion-segment-button>
      <ion-segment-button value="Helper"><ion-label>Pomagam</ion-label></ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="page-column">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @switch (state()) { @case ('loading') {
  <div class="ion-text-center ion-padding" aria-busy="true">
    <ion-spinner name="crescent"></ion-spinner>
  </div>
  } @case ('failed') {
  <app-empty-state
    icon="cloud-offline-outline"
    heading="Nie udało się wczytać rozmów"
    message="Sprawdź połączenie z internetem i spróbuj ponownie."
  >
    <ion-button (click)="reload()">Spróbuj ponownie</ion-button>
  </app-empty-state>
  } @case ('ready') { @if (items().length === 0) {
  <app-empty-state
    icon="chatbubbles-outline"
    heading="Brak rozmów"
    message="Tu pojawią się Twoje pytania i negocjacje – jako zleceniodawca i jako pomocnik."
  >
    <ion-button routerLink="/announcements" fill="outline">Przeglądaj ogłoszenia</ion-button>
  </app-empty-state>
  } @else {
  <ion-list>
    @for (item of items(); track item.conversationId) {
    <app-conversation-item [conversation]="item"></app-conversation-item>
    }
  </ion-list>
  <ion-infinite-scroll [disabled]="complete()" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
  } } }
</ion-content>
